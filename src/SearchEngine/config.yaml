ollama_timeout: 300       # seconds before an Ollama LLM call is abandoned
ollama_flash_attention: false  # OLLAMA_FLASH_ATTENTION — GPU VRAM optimization; minimal gain on CPU-only Pi
# Changing this requires rebuilding/re-embedding every ZIM FAISS index.
# Query embeddings must use the same model/vector space as the stored FAISS vectors.
embed_model: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"  # 384-dim, 50+ languages — shared with zim_indexer, single model in RAM
zim_index_base: "/library/zims/content"   # parent dir of per-ZIM index folders ({name}/data.db + {name}/faiss.index)
db_path: "cache.db" # 
cache_ttl: 604800     # 7 days in seconds

ai_mode:
  system_prompt: "prompts/ai_mode.md"
  llm_model: "qwen2.5:1.5b-instruct-q4_K_M"
  llm_options:
    num_predict: -1   # unlimited — let the model decide when to stop
    num_ctx: 2048     # context window: system prompt + retrieved chunks + answer
    temperature: 0.1
    keep_alive: "15m"
  top_chunks: 3
  semantic_cache:
    similarity_threshold: 0.97

retrieval:
  reranker: "heuristic"          # "heuristic" = weighted second stage, "rrf" = pure RRF fusion order
  min_faiss_score: 0.45         # dense matches below this are ignored unless BM25/title also found them
  infobox_min_score: 0.60       # lowered from 0.80 — multilingual-MiniLM scores lower than arctic-embed-xs
  infobox_max_per_article: 3
  max_prose_chars: 1200         # raw retrieved prose chunk cap before final context compaction
  rrf_k: 60                     # larger = smoother reciprocal-rank-fusion differences
  rrf_weights:                  # all signals enabled for best retrieval
    semantic: 1.0
    paragraph_bm25: 1.0
    title_bm25: 1.0
    section_overlap: 0.6
    aspect_section: 0.9
    title_query_overlap: 0.5
    structure_prior: 0.3
  title_article_chunks: 6       # chunks pulled from articles found by title BM25
  rerank_pool_min: 24           # minimum fused candidates reranked per ZIM
  rerank_pool_multiplier: 6     # fused candidates reranked per ZIM = top_k * this, at minimum above
  answer_filter_query_coverage: 0.34  # keep off-topic chunks only if they cover enough query keywords
  article_score_margin: 0.20    # drop weak articles farther than this below the best article rerank score
  cross_zim_strong_score: 0.80  # apply cross-ZIM filtering only when top semantic score is strong
  cross_zim_margin: 0.05        # keep other ZIM hits only if within this FAISS score margin
  weights:
    fusion: 0.315
    semantic: 0.222
    paragraph_bm25: 0.148
    title_bm25: 0.074
    section_overlap: 0.074
    aspect_section: 0.074
    title_query_overlap: 0.037
    query_coverage: 0.028
    structure_prior: 0.028

# Android inference offloading.
# If set, LLM generation is routed to the Android app instead of Ollama.
# The app runs an Ollama-compatible server on port 11434.
# Example: "http://192.xxx.x.x:11434"
android_inference_url: ""

# Path where MLC-compiled model directories are stored on the Pi.
# Each subdirectory is one model (contains mlc-chat-config.json + weight shards).
# The Android app downloads from here at setup time.
mlc_models_path: "/library/mlc-models"

zim_on_demand:
  max_loaded_zims: 0             # 0 = keep all FAISS indexes in RAM (unlimited)
  ram_cache_articles: 30         # LRU article chunk cache size
  title_fetch_articles: 3        # articles to fetch per query from title index
  title_search_candidates: 20    # top-N candidates from title cosine search
  auto_embed: false              # auto-queue fetched articles for background embedding
  auto_embed_score_threshold: 0.72
  max_articles_per_zim: 2000     # default on-demand embed limit (per ZIM)
  max_vectors_per_zim: 500000    # default FAISS vector cap (per ZIM)

# Hand-picked models recommended for the raspberry Pi 5's 4 GB RAM. These are used in the UI and as defaults for modes.
model_store:
  families:
    - name: "Qwen 2.5"
      description: "Alibaba's multilingual series. Excellent Q&A, reasoning, and instruction following."
      variants:
        - tag: "qwen2.5:0.5b"
          params: "0.5B"
          description: "Ultra-compact (~400 MB). Simple Q&A on any device."
        - tag: "qwen2.5:1.5b"
          params: "1.5B"
          description: "Good multilingual capability (~1 GB)."
        - tag: "qwen2.5:3b"
          params: "3B"
          description: "Best quality/speed for Pi 5 4 GB (~1.9 GB)."
        - tag: "qwen2.5:7b"
          params: "7B"
          description: "Full capability. Needs ~6 GB RAM."
    - name: "Gemma 3"
      description: "Google's instruction-tuned series. Strong safety, reasoning, and efficiency."
      variants:
        - tag: "gemma3:1b"
          params: "1B"
          description: "Lightweight (~815 MB). Fast on Pi."
        - tag: "gemma3:4b"
          params: "4B"
          description: "Best Gemma for 4 GB devices (~2.5 GB)."
        - tag: "gemma3:12b"
          params: "12B"
          description: "High quality. Needs 8 GB+."
    - name: "Llama 3.2"
      description: "Meta's compact Llama 3.2 series. Strong general-purpose performance."
      variants:
        - tag: "llama3.2:1b"
          params: "1B"
          description: "Compact and fast (~1.3 GB)."
        - tag: "llama3.2:3b"
          params: "3B"
          description: "Balanced performance (~2 GB)."
    - name: "Phi 4 Mini"
      description: "Microsoft's Phi-4 Mini. Strong coding and step-by-step reasoning."
      variants:
        - tag: "phi4-mini"
          params: "3.8B"
          description: "Strong math and code (~2.5 GB)."
    - name: "SmolLM 2"
      description: "Hugging Face ultra-small models. Ideal for highly constrained hardware."
      variants:
        - tag: "smollm2:135m"
          params: "135M"
          description: "Runs anywhere (~270 MB)."
        - tag: "smollm2:360m"
          params: "360M"
          description: "Good accuracy (~726 MB)."
        - tag: "smollm2:1.7b"
          params: "1.7B"
          description: "Best SmolLM for Pi 5 (~1.8 GB)."
    - name: "DeepSeek-R1 (Distilled)"
      description: "Reasoning-focused distilled models. Great for step-by-step problem solving."
      variants:
        - tag: "deepseek-r1:1.5b"
          params: "1.5B"
          description: "Compact reasoning model (~1 GB)."
        - tag: "deepseek-r1:7b"
          params: "7B"
          description: "Strong reasoning. Needs 6 GB+."

zims:
  - name: "wikipedia_en_medicine_maxi_2026-04"
    count: 5
    has_images: false
