# Complex mode — FAISS + BM25 + RRF, then full article expansion on top hit
#
# Stage 1: FAISS semantic search + FTS5 BM25 title → RRF fusion (wider pool)
# Stage 2: fetch ALL sections of the top winning article from SQLite,
#           embed in one batch on-the-fly, cosine-rank, pick best chunks
# Result:  semantically best chunks from the full article, not just Phase 1

retrieval:
  faiss_candidates: 80       # FAISS top-k pool
  bm25_candidates: 50        # BM25 title matches
  top_k: 5                   # total chunks returned to LLM
  expansion_top_chunks: 5    # chunks to pick per expanded article
  high_conf_threshold: 0.75  # faiss_score above this → expand 1 article (confident)
                             # below this → expand 2 articles (hedge)
  cross_article_slots: 2     # slots reserved for non-expanded RRF hits (other articles)

llm_model: "qwen2.5:0.5b"
llm_options:
  num_predict: 400
  num_ctx: 2048
  temperature: 0.1
  keep_alive: "25m"

system_prompt: "prompts/ai_mode_complex.md"
