# Complex mode — coverage-first retrieval.
# Keeps broad context for synthesis/page-style requests instead of pruning to direct answers only.

retrieval:
  faiss_candidates: 100
  bm25_candidates: 60
  top_k: 6
  answer_filter: true

think: false   # retrieval already handles reasoning; thinking loops waste context

# llm_model: inherit from _active_model (set via UI or config.yaml ai_mode.llm_model)
llm_options:
  num_predict: 400
  num_ctx: 2048
  temperature: 0.1
  keep_alive: "25m"

system_prompt: "prompts/ai_mode_complex.md"

caps:
  num_predict: 1200
  temperature: 2.0
