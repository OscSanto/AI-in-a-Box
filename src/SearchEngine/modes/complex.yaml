# Complex mode — FAISS + BM25 + weighted reranker, largest candidate pool

retrieval:
  faiss_candidates: 80
  bm25_candidates: 50
  top_k: 5

llm_model: "qwen2.5:0.5b"
llm_options:
  num_predict: 400
  num_ctx: 2048
  temperature: 0.1
  keep_alive: "25m"

system_prompt: "prompts/ai_mode_complex.md"
