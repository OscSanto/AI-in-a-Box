# Fast mode — bare Ollama request, no llm_options specified.
# Mirrors RAGv2 evaluation conditions for fair comparison.

retrieval:
  faiss_candidates: 20       # FAISS top-k pool (top_k × 2)
  bm25_candidates: 20        # BM25 title matches (top_k × 2)
  top_k: 2                   # chunks returned to LLM
  answer_filter: false

# llm_model: inherit from _active_model (set via UI or config.yaml ai_mode.llm_model)
# No llm_options — Ollama uses model defaults, same as RAGv2
think: false   # retrieval already handles reasoning; thinking loops waste context

system_prompt: "prompts/ai_mode_fast.md"

caps:
  num_predict: 400
  temperature: 2.0
