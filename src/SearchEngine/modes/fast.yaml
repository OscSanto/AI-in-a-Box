# Fast mode — keyword-first retrieval, no query-time embedding
#
# Stage 1: FTS5 BM25 finds the best matching article by title
# Stage 2: keyword score against all stored chunk texts for that article
# Result:  top chunks passed to LLM for a quick answer

retrieval:
  faiss_candidates: 20       # FAISS top-k pool (top_k × 2)
  bm25_candidates: 20        # BM25 title matches (top_k × 2)
  top_k: 2                   # chunks returned to LLM

llm_model: "qwen2.5:0.5b"
llm_options:
  num_predict: 80
  num_ctx: 512
  temperature: 0.0
  keep_alive: "25m"

system_prompt: "prompts/ai_mode_fast.md"
