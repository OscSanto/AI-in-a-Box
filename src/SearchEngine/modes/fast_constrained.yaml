# Fast constrained — same retrieval as fast, but with explicit LLM options.
# Use this to test the effect of capping num_predict/num_ctx/temperature
# vs the bare fast mode (which uses Ollama model defaults like RAGv2).

retrieval:
  faiss_candidates: 20
  bm25_candidates: 20
  top_k: 2
  answer_filter: false

llm_model: "qwen2.5:0.5b"
llm_options:
  num_predict: 80
  num_ctx: 512
  temperature: 0.0
  keep_alive: "25m"

system_prompt: "prompts/ai_mode_fast.md"
